name: Dev kit

# Builds the offline dev kit (scripts/devkit/build.sh) on Apple Silicon and
# force-pushes it to the `devkit` branch as one orphan commit, split into
# parts under GitHub's 100 MB file limit, for machines that can only reach
# GitHub over git. release-macos.yml also calls this to attach the zip to
# each release.

on:
  push:
    branches: [main]
    paths:
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - "*/package.json"
      - "*/*/package.json"
      - patches/**
      - scripts/devkit/**
      - .github/workflows/devkit.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: devkit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build dev kit
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Build dev kit
        run: |
          mkdir -p release
          scripts/devkit/build.sh release/c3-devkit-darwin-arm64.zip

      - name: Upload dev kit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: c3-devkit-darwin-arm64
          path: release/c3-devkit-darwin-arm64.zip
          compression-level: 0
          if-no-files-found: error

      - name: Push devkit branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch_dir="$RUNNER_TEMP/devkit-branch"
          mkdir -p "$branch_dir"
          cd "$branch_dir"
          kit=c3-devkit-darwin-arm64.zip
          cp "$GITHUB_WORKSPACE/release/$kit" .
          shasum -a 256 "$kit" > "$kit.sha256"
          split -b 90m -d -a 2 "$kit" "$kit.part-"
          rm "$kit"
          unzip -p "$GITHUB_WORKSPACE/release/$kit" .devkit/manifest > manifest
          printf '%s\n' \
            "# C3 Code dev kit" \
            "" \
            "Generated by .github/workflows/devkit.yml; do not edit. Install it from a" \
            "checkout of main with \`scripts/devkit/install.sh\`." > README.md
          git init -q -b devkit
          git add .
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "devkit for $GITHUB_SHA"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" devkit
