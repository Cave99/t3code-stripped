name: Release macOS

# Pushing a `c3-v*` tag builds a self-contained C3 Code.app (Electron, the
# server bundle, and its native modules) for both Mac architectures and
# attaches the DMGs and the offline dev kit to a GitHub release. The prefix
# keeps upstream's `v*` tags, which local clones carry, from ever publishing
# here. Running it by hand builds the same artifacts without publishing them.
#
# Builds are signed ad hoc, not with a Developer ID, so the first launch needs
# the Gatekeeper step in docs/user/install.md.

on:
  push:
    tags: ["c3-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
          - arch: x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#c3-v}"
          else
            version="$(node -p "require('./apps/desktop/package.json').version")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        run: >-
          vp run dist:desktop:artifact
          --platform mac
          --target dmg
          --arch ${{ matrix.arch }}
          --build-version ${{ steps.version.outputs.version }}
          --verbose

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: c3-code-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  devkit:
    name: Dev kit
    uses: ./.github/workflows/devkit.yml
    permissions:
      contents: write

  publish:
    name: Publish release
    needs: [build, devkit]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release && shasum -a 256 *.dmg *.zip > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "C3 Code ${GITHUB_REF_NAME#c3-v}" \
            --generate-notes
